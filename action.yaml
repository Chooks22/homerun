name: Homerun
description: Install the Homerun CLI and run any homerun command with it, or just put it on the PATH for the steps after.
author: orochibraru
branding:
  icon: upload-cloud
  color: red

inputs:
  base-url:
    description: Your instance's URL, e.g. https://homerun.example.com, used for `args`. Steps after this one read HOMERUN_BASE_URL from their own env.
    required: false
    default: ""
  api-key:
    description: A Homerun API key, used for `args` only and never exported. Store it as a secret.
    required: false
    default: ""
  args:
    description: A homerun command to run, e.g. `services deploy my-app --tag abc123`, split on whitespace. Empty only installs the CLI.
    required: false
    default: ""
  cli-version:
    description: CLI release to install, e.g. v1.0.49. Defaults to this action's own tag when it's a release, the latest release otherwise.
    required: false
    default: ""

outputs:
  stdout:
    description: What the command printed on stdout.
    value: ${{ steps.run.outputs.stdout }}
  cli-path:
    description: The installed CLI binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install the Homerun CLI
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: bash "$ACTION_PATH/actions/install-cli.sh"

    - name: Run homerun
      id: run
      if: inputs.args != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_URL: ${{ inputs.base-url }}
        API_KEY: ${{ inputs.api-key }}
        ARGS: ${{ inputs.args }}
      run: |
        read -ra words <<< "$ARGS"
        bash "$ACTION_PATH/actions/run-cli.sh" "${words[@]}"
