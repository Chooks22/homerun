# homerun:generated
# Generated by Homerun. Every self-update OVERWRITES this file with the one
# shipped in the new release, so any edit made here is lost. Put your settings
# in .env (next to this file) or homerun.yaml instead.
services:
  app:
    image: ${HOMERUN_IMAGE:-docker.io/orochibraru/homerun}:${HOMERUN_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homerun}:${POSTGRES_PASSWORD:-homerun}@postgres:5432/${POSTGRES_DB:-homerun}
      AUTH_SECRET: "${AUTH_SECRET:?missing from .env - the installer generates this automatically, set it yourself only if running this compose file standalone, e.g. openssl rand -hex 32}"
      ORIGIN: ${ORIGIN:-http://${HOMERUN_HOST:?set HOMERUN_HOST in .env to the domain or IP this instance is reached at}:${HOMERUN_DASHBOARD_PORT:-3000}}
      WORKER_URL: ${WORKER_URL:-http://worker:7430}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      TRAEFIK_DYNAMIC_CONFIG_DIR: /app/traefik-dynamic
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homerun.rule=Host(`${DASHBOARD_DOMAIN:-${HOMERUN_HOST}}`)"
      - "traefik.http.routers.homerun.entrypoints=${DASHBOARD_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.homerun.tls=true"
      - "traefik.http.routers.homerun.tls.certresolver=${DASHBOARD_CERT_RESOLVER-letsencrypt}"
      - "traefik.http.services.homerun.loadbalancer.server.port=3000"
    ports:
      - "${HOMERUN_DASHBOARD_PORT:-3000}:3000"
    volumes:
      - homerun-data:/app/data
      - traefik-dynamic:/app/traefik-dynamic
      - ./homerun.yaml:/app/homerun.yaml:ro
    networks:
      homerun:
        aliases:
          - homerun-auth
      default: {}

  worker:
    image: ${HOMERUN_IMAGE:-docker.io/orochibraru/homerun}:${HOMERUN_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 75s
    command: ["/usr/local/bin/homerun-worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homerun}:${POSTGRES_PASSWORD:-homerun}@postgres:5432/${POSTGRES_DB:-homerun}
      AUTH_SECRET: "${AUTH_SECRET:?missing from .env - the installer generates this automatically}"
      DOCKER_SOCKET_PATH: ${HOMERUN_DOCKER_SOCKET:-/var/run/docker.sock}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_PORT: ${WORKER_PORT:-7430}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
    labels:
      - "homerun.role=worker"
    expose:
      - "${WORKER_PORT:-7430}"
    healthcheck:
      disable: true
    volumes:
      - ${HOMERUN_DOCKER_SOCKET:-/var/run/docker.sock}:${HOMERUN_DOCKER_SOCKET:-/var/run/docker.sock}
      - homerun-data:/app/data
    networks:
      - homerun
      - default

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homerun
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      - --entrypoints.websecure.http3.advertisedport=${HOMERUN_HTTPS_PORT:-443}
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addserviceslabels=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOMERUN_HTTP_PORT:-80}:80"
      - "${HOMERUN_HTTPS_PORT:-443}:443"
      - "${HOMERUN_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${HOMERUN_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - traefik-dynamic:/etc/traefik/dynamic
    networks:
      - homerun

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homerun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homerun}
      POSTGRES_USER: ${POSTGRES_USER:-homerun}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homerun}"]
      timeout: 5s

networks:
  homerun:
    name: homerun
    external: true

volumes:
  postgres-data: {}
  traefik-certs: {}
  traefik-dynamic: {}
  homerun-data: {}
