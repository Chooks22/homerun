env = false

[run]
bun = true

[test]
preload = [
	"./tests/unit/app/svelte-loader.ts",
	"./tests/unit/support/homedir-preload.ts",
]
timeout = 120_000
pathIgnorePatterns = ["**/tests/e2e/**", "**/tests/integration/**"]
coverage = true
coveragePathIgnorePatterns = [
	"tests/**",
	"src/lib/dto/**",
	"src/lib/server/db/**",
	"src/lib/services/docker/**",
	"src/lib/services/docker.service.ts",
	"src/lib/services/deploy/**",
	"src/lib/services/deploy.service.ts",
	"src/lib/services/image-scan.service.ts",
	"src/lib/services/image-mirror-gc.service.ts",
	"src/lib/services/registry.service.ts",
	"src/lib/services/object-storage.service.ts",
	"src/lib/services/s3-backup.service.ts",
	"src/lib/services/backup/**",
	"src/lib/services/system-stats.service.ts",
]
coverageThreshold = { functions = 0.8, lines = 0.8 }
