services:
  app:
    image: docker.io/orochibraru/homerun:${HOMERUN_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homerun}:${POSTGRES_PASSWORD:-homerun}@postgres:5432/${POSTGRES_DB:-homerun}
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env before starting, e.g. openssl rand -hex 32 or bunx auth secret}"
      WORKER_URL: ${WORKER_URL:-http://worker:7430}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      TRAEFIK_DYNAMIC_CONFIG_DIR: /app/traefik-dynamic
      ORIGIN: "${ORIGIN:?set ORIGIN in .env to the scheme+host you open the dashboard at, e.g. http://203.0.113.10:3000 - a localhost default makes the first sign-up fail with Invalid origin from any other machine}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homerun.rule=Host(`${DASHBOARD_DOMAIN:-localhost}`)"
      - "traefik.http.routers.homerun.entrypoints=${DASHBOARD_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.homerun.tls=true"
      - "traefik.http.routers.homerun.tls.certresolver=${DASHBOARD_DOMAIN:+${DASHBOARD_CERT_RESOLVER:-letsencrypt}}"
      - "traefik.http.services.homerun.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
      - traefik_dynamic:/app/traefik-dynamic
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 5s
      test: ["CMD", "/app/build/healthcheck"]
      timeout: 30s
    networks:
      homerun:
        aliases:
          - homerun-auth
      internal: {}

  worker:
    image: docker.io/orochibraru/homerun:${HOMERUN_VERSION:-latest}
    restart: unless-stopped
    command: ["/usr/local/bin/homerun-worker"]
    labels:
      - "homerun.role=worker"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 65s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homerun}:${POSTGRES_PASSWORD:-homerun}@postgres:5432/${POSTGRES_DB:-homerun}
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env before starting, e.g. openssl rand -hex 32 or bunx auth secret}"
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_PORT: ${WORKER_PORT:-7430}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      disable: true
    networks:
      - homerun
      - internal

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homerun
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addserviceslabels=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
      - traefik_dynamic:/etc/traefik/dynamic
    networks:
      - homerun
      - internal

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homerun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homerun}
      POSTGRES_USER: ${POSTGRES_USER:-homerun}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homerun}"]
      timeout: 5s
    networks:
      - internal

networks:
  homerun:
    name: homerun
    external: true
  internal:
    external: false

volumes:
  postgres_data: {}
  traefik_certs: {}
  traefik_dynamic: {}
  app_data: {}
