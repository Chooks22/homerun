name: Publish
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Merged PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      promote: ${{ steps.resolve.outputs.promote }}
      release: ${{ steps.kind.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tell a merged release PR from a canary push
        id: kind
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^chore\(release\):\ [0-9]+\.[0-9]+\.[0-9]+(\ \(#[0-9]+\))?$ ]]; then
            echo "Merged release PR ($subject): releasing the canary instead of building a new one."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the PR and whether its images can be promoted
        id: resolve
        if: steps.kind.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "promote=false" >> "$GITHUB_OUTPUT"

          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            echo "Direct push, no PR to promote from: building from scratch."
            exit 0
          fi

          head="$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')"
          git fetch --quiet origin "refs/pull/$pr/head"
          drift="$(git diff --name-only "$head" "$SHA" -- . ':(exclude)CHANGELOG.md' ':(exclude)package.json')"
          if [ -n "$drift" ] || [ "$(git show "$head:package.json" | jq -S 'del(.version)')" != "$(git show "$SHA:package.json" | jq -S 'del(.version)')" ]; then
            echo "PR #$pr differs from this commit beyond a release bump, so its images don't match: building from scratch."
            echo "$drift"
            exit 0
          fi

          gate="$(gh api "repos/$REPO/commits/$head/check-runs?check_name=CI%20Gate" --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "$gate" = "0" ]; then
            echo "CI Gate never passed on PR #$pr's head $head: building from scratch."
            exit 0
          fi

          for image in homerun homerun-worker; do
            if ! docker buildx imagetools inspect "docker.io/orochibraru/$image:pr-$pr" > /dev/null 2>&1; then
              echo "docker.io/orochibraru/$image:pr-$pr doesn't exist: building from scratch."
              exit 0
            fi
          done

          echo "Promoting PR #$pr's already-tested images instead of rebuilding."
          echo "promote=true" >> "$GITHUB_OUTPUT"

  code_quality:
    name: Code Quality
    needs: [resolve]
    if:
      needs.resolve.outputs.release == 'false' && needs.resolve.outputs.promote
      != 'true'
    uses: ./.github/workflows/code_quality.yaml
    secrets:
      HOMERUN_TEST_S3_ACCESS_KEY_ID:
        ${{ secrets.HOMERUN_TEST_S3_ACCESS_KEY_ID }}
      HOMERUN_TEST_S3_SECRET_ACCESS_KEY:
        ${{ secrets.HOMERUN_TEST_S3_SECRET_ACCESS_KEY }}

  go:
    name: Go
    needs: [resolve]
    if:
      needs.resolve.outputs.release == 'false' && needs.resolve.outputs.promote
      != 'true'
    uses: ./.github/workflows/go.yaml

  version:
    name: Compute Canary Version
    needs: [resolve]
    if: needs.resolve.outputs.release == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dry-run release to compute the next version
        id: releaser
        uses: orochibraru/releaser@f4e670849b608549cd6ac88d32eeb41cab364709 # v1.7.1
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          dry-run: "true"

      - name: Resolve canary version and image tag
        id: compute
        env:
          VERSION: ${{ steps.releaser.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          base="${VERSION:-$(jq -r .version package.json)}"
          version="$base-canary.$(git rev-list --count HEAD)"
          echo "This push publishes canary $version (images tagged $SHA and canary) once e2e passes."
          {
            echo "tag=$SHA"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build-app:
    name: Docker Build (App)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - go
      - version
    with:
      app_version: ${{ needs.version.outputs.version }}
      image_tag: ${{ needs.version.outputs.tag }}
      extra_tag: canary
      image_name: orochibraru/homerun
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  build-worker:
    name: Docker Build (Worker)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - go
      - version
    with:
      app_version: ${{ needs.version.outputs.version }}
      image_tag: ${{ needs.version.outputs.tag }}
      extra_tag: canary
      image_name: orochibraru/homerun-worker
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: worker-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yaml
    needs:
      - code_quality
      - go
      - version
    if:
      ${{ !cancelled() && !contains(needs.*.result, 'failure') &&
      needs.version.result == 'success' }}
    with:
      version: ${{ needs.version.outputs.version }}

  templates:
    name: Templates E2E
    needs: [resolve]
    if: needs.resolve.outputs.release == 'false'
    uses: ./.github/workflows/templates-e2e.yaml
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  e2e:
    name: E2E
    needs: [build-app]
    uses: ./.github/workflows/e2e.yaml
    with:
      image: ${{ needs.build-app.outputs.image }}
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  publish-app:
    name: Publish App ${{ needs.version.outputs.tag }}
    needs: [version, e2e]
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/homerun
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  publish-worker:
    name: Publish Worker ${{ needs.version.outputs.tag }}
    needs: [version, e2e, build-worker]
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/homerun-worker
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: worker-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  promote:
    name:
      Promote pr-${{ needs.resolve.outputs.pr }} to ${{
      needs.version.outputs.tag }}
    needs: [resolve, version]
    if: needs.resolve.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the tested images
        env:
          PR: ${{ needs.resolve.outputs.pr }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          app=docker.io/orochibraru/homerun
          printf 'FROM %s:pr-%s\nENV HOMERUN_APP_VERSION=%s\n' "$app" "$PR" "$VERSION" \
            | docker buildx build --platform linux/amd64,linux/arm64 -t "$app:$TAG" -t "$app:v$VERSION" -t "$app:canary" --push -
          docker buildx imagetools inspect "$app:$TAG"
          worker=docker.io/orochibraru/homerun-worker
          docker buildx imagetools create -t "$worker:$TAG" -t "$worker:v$VERSION" -t "$worker:canary" "$worker:pr-$PR"
          docker buildx imagetools inspect "$worker:$TAG"

  cleanup:
    name: PR Cleanup
    needs: [resolve, promote, publish-app, publish-worker]
    if:
      ${{ !cancelled() && needs.resolve.outputs.pr != '' &&
      !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/delete-pr-images.yaml
    with:
      pr_number: ${{ needs.resolve.outputs.pr }}
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  canary:
    name: Canary Release
    runs-on: ubuntu-latest
    needs:
      - code_quality
      - go
      - version
      - build-app
      - build-worker
      - binaries
      - e2e
      - publish-app
      - publish-worker
      - promote
    if:
      ${{ !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.promote.result == 'success' || (needs.publish-app.result ==
      'success' && needs.publish-worker.result == 'success')) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }} # zizmor: ignore[artipacked]

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download binaries
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Publish the canary prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --prerelease --target "$SHA" \
            --title "Canary $VERSION" \
            --notes "Canary build of $SHA. Not a stable release: run it with HOMERUN_VERSION=canary. Merge the open chore(release) PR to release it."
          bun scripts/upload-release-assets.ts "v$VERSION" --prerelease
          gh release list --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease and (.tagName | contains("-canary.")))] | .[5:] | .[].tagName' \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes || echo "::warning::Could not prune canary $tag"; done

      - name: Open or update the release PR
        uses: orochibraru/releaser@f4e670849b608549cd6ac88d32eeb41cab364709 # v1.7.1
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          prepare: bunx prettier --write CHANGELOG.md
          release-pr: "true"
          token: ${{ secrets.RELEASE_TOKEN }}

  stable:
    name: Resolve Stable Release
    needs: [resolve]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.canary.outputs.sha }}
      tag: ${{ steps.releaser.outputs.tag }}
      version: ${{ steps.releaser.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the canary is what this release ships
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease and (.tagName | contains("-canary.")))][0].tagName')"
          git fetch --quiet --force origin "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-parse "$tag^{commit}")"
          drift="$(git diff --name-only "$sha" HEAD -- . ':(glob,exclude)docs/**' ':(glob,exclude)**/*.md' ':(glob,exclude).agents/**' ':(glob,exclude).claude/**' ':(exclude)package.json')"
          if [ -n "$drift" ] || [ "$(git show "$sha:package.json" | jq -S 'del(.version)')" != "$(jq -S 'del(.version)' package.json)" ]; then
            echo "::error::The release PR carries changes the canary ($sha) wasn't built from. Let Publish finish on main, then re-run this workflow."
            echo "$drift"
            exit 1
          fi
          echo "Releasing canary $sha."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Dry-run release to read the version
        id: releaser
        uses: orochibraru/releaser@f4e670849b608549cd6ac88d32eeb41cab364709 # v1.7.1
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          release-pr: "true"
          dry-run: "true"

      - name: Fail without a version
        if: steps.releaser.outputs.version == ''
        run: |
          echo "::error::releaser found no release to cut from this commit."
          exit 1

  stable-binaries:
    name: Stable Binaries
    needs: [stable]
    uses: ./.github/workflows/binaries.yaml
    with:
      version: ${{ needs.stable.outputs.version }}

  stable-images:
    name: Promote Canary Images to ${{ needs.stable.outputs.tag }}
    needs: [stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.stable.outputs.sha }}
          persist-credentials: false

      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the canary images
        env:
          SHA: ${{ needs.stable.outputs.sha }}
          TAG: ${{ needs.stable.outputs.tag }}
          VERSION: ${{ needs.stable.outputs.version }}
        run: |
          set -euo pipefail
          app=docker.io/orochibraru/homerun
          printf 'FROM %s:%s\nENV HOMERUN_APP_VERSION=%s\n' "$app" "$SHA" "$VERSION" \
            | docker buildx build --platform linux/amd64,linux/arm64 -t "$app:$TAG" -t "$app:latest" -t "$app:canary" --push -
          docker buildx imagetools inspect "$app:$TAG"
          worker=docker.io/orochibraru/homerun-worker
          docker buildx imagetools create -t "$worker:$TAG" -t "$worker:latest" -t "$worker:canary" "$worker:$SHA"
          docker buildx imagetools inspect "$worker:$TAG"

      - name: Build and push the CLI image
        env:
          TAG: ${{ needs.stable.outputs.tag }}
          VERSION: ${{ needs.stable.outputs.version }}
        run: |
          set -euo pipefail
          cli=docker.io/orochibraru/homerun-cli
          docker buildx build --target cli --platform linux/amd64,linux/arm64 \
            --build-arg "HOMERUN_VERSION=$VERSION" \
            -t "$cli:$TAG" -t "$cli:latest" --push .
          docker buildx imagetools inspect "$cli:$TAG"

  stable-release:
    name: Release ${{ needs.stable.outputs.tag }}
    needs: [stable, stable-binaries, stable-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }} # zizmor: ignore[artipacked]

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download binaries
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Tag the release commit and draft the release
        id: releaser
        uses: orochibraru/releaser@f4e670849b608549cd6ac88d32eeb41cab364709 # v1.7.1
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          release-pr: "true"
          draft: "true"
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload binaries and publish the release
        if: steps.releaser.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.releaser.outputs.tag }}
        run: bun scripts/upload-release-assets.ts "$TAG"

  stable-terraform-provider:
    name: Publish Terraform Provider ${{ needs.stable.outputs.tag }}
    needs: [stable, stable-release]
    runs-on: ubuntu-latest
    env:
      MIRROR: orochibraru/terraform-provider-homerun
      VERSION: ${{ needs.stable.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Package and sign the provider
        env:
          TERRAFORM_PROVIDER_GPG_PASSPHRASE:
            ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}
        run: scripts/package-terraform-provider.sh "$VERSION"

      - name: Push the provider source to the mirror repo
        env:
          TOKEN: ${{ secrets.TERRAFORM_PROVIDER_REPO_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:$TOKEN@github.com/$MIRROR.git"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/v$VERSION" >/dev/null; then
            echo "$MIRROR already has v$VERSION."
            exit 0
          fi
          git clone --quiet "$remote" mirror
          find mirror -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R terraform/provider/. mirror/
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit --quiet -m "chore(release): $VERSION" -m "From orochibraru/homerun@$SHA."
          fi
          git tag "v$VERSION"
          git push --quiet origin HEAD:refs/heads/main "refs/tags/v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.TERRAFORM_PROVIDER_REPO_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$MIRROR" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$MIRROR" --clobber dist/terraform-provider/*
            gh release edit "$tag" --repo "$MIRROR" --draft=false --latest
          else
            gh release create "$tag" --repo "$MIRROR" --verify-tag --latest \
              --title "$tag" \
              --notes "Homerun Terraform provider $VERSION, built from orochibraru/homerun@$SHA. Issues and source: https://github.com/orochibraru/homerun." \
              dist/terraform-provider/*
          fi

  stable-screenshots:
    name: Refresh Screenshots
    needs: [stable-release]
    uses: ./.github/workflows/screenshots-refresh.yaml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      DOCS_TRIGGER_TOKEN: ${{ secrets.DOCS_TRIGGER_TOKEN }}
