name: E2E
# Runs Playwright against the image `docker.yaml` just built, rather than
# building the app a second time from source. Forks push no digest, so
# `pulled: false` falls back to a local `bun run build`.

on:
  workflow_call:
    inputs:
      image:
        required: true
        description: "Registry path of the image under test, without a tag"
        type: string
      registry_name:
        required: true
        type: string
      registry_username:
        required: true
        type: string
      bake_target:
        required: true
        description: "Target whose amd64 digest artefact should be pulled"
        type: string
      pulled:
        required: false
        default: true
        description:
          "False when no image was pushed (forks), forcing a local build"
        type: boolean
    secrets:
      registry_password:
        required: false
    outputs:
      summary:
        description: "Playwright's own pass/fail counts for this run"
        value: ${{ jobs.e2e.outputs.summary }}

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  NO_COLOR: "1"

jobs:
  e2e:
    name: Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      summary: ${{ steps.stats.outputs.summary }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: homerun
          POSTGRES_PASSWORD: homerun
          POSTGRES_DB: homerun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homerun -d homerun_test" --health-interval
          5s --health-timeout 5s --health-retries 20
    env:
      HOMERUN_TEST_POSTGRES_URL: postgres://homerun:homerun@127.0.0.1:5432/homerun_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pull Docker Hub images through Google's mirror
        run: |
          daemon_config=/etc/docker/daemon.json
          current="$(sudo cat "$daemon_config" 2>/dev/null || true)"
          [ -n "$current" ] || current='{}'
          echo "$current" | jq '."registry-mirrors" = ["https://mirror.gcr.io"]' | sudo tee "$daemon_config" >/dev/null
          sudo systemctl reload docker
          for _ in $(seq 20); do
            docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io && exit 0
            sleep 1
          done
          echo "::error::The Docker daemon never picked up the registry mirror."
          exit 1

      - name: Login to Container registry
        if: inputs.pulled
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password }}

      # The digest artefact is a single empty file named after the digest.
      - name: Download amd64 digest
        if: inputs.pulled
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          name: digests-${{ inputs.bake_target }}-linux-amd64
          path: ${{ runner.temp }}/digest

      - name: Resolve and pull the image under test
        if: inputs.pulled
        env:
          BAKE_TARGET: ${{ inputs.bake_target }}
          IMAGE: ${{ inputs.image }}
        run: |
          digest="$(find "$RUNNER_TEMP/digest" -type f -printf '%f\n' | head -n1)"
          if [ -z "$digest" ]; then
            echo "::error::No digest artefact found for $BAKE_TARGET (linux/amd64)"
            exit 1
          fi
          ref="$IMAGE@sha256:${digest}"
          echo "Testing $ref"
          docker pull "$ref"
          echo "E2E_IMAGE=$ref" >> "$GITHUB_ENV"

      # Only reached on a fork, where no image was pushed to pull.
      - name: Build app from source
        if: ${{ !inputs.pulled }}
        run: bun run build

      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium

      - name: Tests (E2E)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        timeout-minutes: 30
        run: bun run test:e2e -- --reporter=list,json

      - name: Summarise the run
        id: stats
        if: always()
        run: |
          if [ -f playwright-results.json ]; then
            jq -r '.stats | "summary=\(.expected) passed" + (if .flaky > 0 then ", \(.flaky) flaky" else "" end) + (if .unexpected > 0 then ", \(.unexpected) failed" else "" end)' \
              playwright-results.json >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        if: failure()
        uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
