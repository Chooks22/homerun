name: Templates E2E

on:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ""
        description: "Commit or branch to test, the triggering commit when empty"
        type: string
      templates:
        required: false
        default: ""
        description: "Comma-separated template slugs to deploy, every template when empty"
        type: string
    secrets:
      registry_password:
        required: false
    outputs:
      summary:
        description: "Pass/fail counts over the built-in templates"
        value: ${{ jobs.summary.outputs.summary }}

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  NO_COLOR: "1"

jobs:
  plan:
    name: Build and list templates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      slugs: ${{ steps.slugs.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: List the templates to deploy
        id: slugs
        env:
          TEMPLATES: ${{ inputs.templates }}
        run: |
          if [ -n "$TEMPLATES" ]; then
            slugs="$(printf '%s' "$TEMPLATES" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          else
            slugs="$(find templates -mindepth 2 -maxdepth 2 -name '*.json' -exec basename {} .json \; | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Deploying $(printf '%s' "$slugs" | jq length) template(s)"

      - name: Build app from source
        run: bun run build

      - name: Pack the build
        run: tar -czf homerun-build.tgz build

      - name: Upload the build
        uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        with:
          name: templates-e2e-build
          path: homerun-build.tgz
          retention-days: 1

  deploy:
    name: ${{ matrix.slug }}
    needs: [plan]
    if: needs.plan.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    env:
      HOMERUN_TEST_POSTGRES_URL: postgres://homerun:homerun@127.0.0.1:5432/homerun_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Go modules
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "::warning::go mod download attempt $attempt failed"
            sleep 15
          done
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the build
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          name: templates-e2e-build

      - name: Unpack the build
        run: tar -xzf homerun-build.tgz

      - name: Log in to Docker Hub for pull limits
        env:
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "No registry secret: pulling anonymously."
            exit 0
          fi
          for attempt in 1 2 3; do
            if echo "$REGISTRY_PASSWORD" | docker login docker.io -u orochibraru --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::warning::Docker Hub login failed three times: pulling anonymously."

      - name: Seed the infrastructure images from Docker Hub mirrors
        run: |
          trivy="$(grep -oE 'aquasec/trivy:[0-9.]+' internal/jobs/imagescan/scan.go)"
          pull() {
            for attempt in 1 2 3; do
              docker pull -q "$1" && docker tag "$1" "$2" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          seed() {
            for source in mirror.gcr.io/library public.ecr.aws/docker/library docker.io/library; do
              pull "$source/$1" "$1" && return 0
            done
            return 1
          }
          seed postgres:18-alpine
          seed traefik:v3
          seed registry:2
          pull "ghcr.io/aquasecurity/trivy:${trivy#*:}" "$trivy"

      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_USER=homerun -e POSTGRES_PASSWORD=homerun -e POSTGRES_DB=homerun_test \
            postgres:18-alpine
          for _ in $(seq 60); do
            docker exec ci-postgres pg_isready -U homerun -d homerun_test && exit 0
            sleep 2
          done
          docker logs ci-postgres
          exit 1

      - name: Install Playwright's Chromium
        timeout-minutes: 20
        run: |
          bunx playwright install chromium
          if bun -e 'const { chromium } = await import("@playwright/test"); await (await chromium.launch()).close();'; then
            exit 0
          fi
          echo "::warning::Chromium doesn't launch with the runner's own libraries, installing its system dependencies"
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null
          for attempt in 1 2 3; do
            bunx playwright install-deps chromium && exit 0
            echo "::warning::Playwright dependency install attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Deploy ${{ matrix.slug }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          TEMPLATES_E2E_ONLY: ${{ matrix.slug }}
          TEMPLATES_E2E_WORKERS: "1"
        timeout-minutes: 22
        run: bunx playwright test --config playwright.templates.config.ts --reporter=list,json,./tests/e2e/templates/report.ts

      - name: Keep the result for the summary
        if: always()
        uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        with:
          name: templates-e2e-result-${{ matrix.slug }}
          path: playwright-results.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the trace
        if: failure()
        uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        with:
          name: playwright-report-templates-${{ matrix.slug }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Summarise the templates
    needs: [plan, deploy]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      summary: ${{ steps.stats.outputs.summary }}
    steps:
      - name: Download every result
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          pattern: templates-e2e-result-*
          path: results

      - name: Add them up
        id: stats
        run: |
          if [ -z "$(find results -name playwright-results.json 2>/dev/null)" ]; then
            echo "summary=no results" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          find results -name playwright-results.json -print0 | xargs -0 jq -rs '
            [.[] | .. | objects | select(.projectName? == "templates") | .status]
            | {passed: map(select(. == "expected")) | length, flaky: map(select(. == "flaky")) | length, failed: map(select(. == "unexpected")) | length, skipped: map(select(. == "skipped")) | length}
            | "summary=\(.passed) passed" + (if .flaky > 0 then ", \(.flaky) flaky" else "" end) + (if .failed > 0 then ", \(.failed) failed" else "" end) + (if .skipped > 0 then ", \(.skipped) skipped" else "" end)
          ' >> "$GITHUB_OUTPUT"
          grep '^summary=' "$GITHUB_OUTPUT" | tail -1 | sed 's/^summary=/### Templates: /' >> "$GITHUB_STEP_SUMMARY"
