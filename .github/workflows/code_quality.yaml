name: Code Quality
# Static checks and unit/integration tests. E2E lives in `e2e.yaml`, so it can
# run against the already-built image instead of a second build from source.
on:
  workflow_call:
    inputs:
      tests:
        required: false
        default: true
        description:
          "Run the unit + integration suite. False for docs-only changes."
        type: boolean
      ref:
        required: false
        default: ""
        description: "Commit to test. Empty tests the event's own commit"
        type: string
    secrets:
      HOMERUN_TEST_S3_ACCESS_KEY_ID:
        required: false
      HOMERUN_TEST_S3_SECRET_ACCESS_KEY:
        required: false
    outputs:
      lint:
        description: "Result of the lint/type-check/codegen job"
        value: ${{ jobs.lint.outputs.result }}
      tests:
        description: "Result of the unit + integration test job"
        value: ${{ jobs['ts-test'].outputs.result }}

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"
  COLUMNS: "9999"
  NO_COLOR: "1"

jobs:
  lint:
    name: Linting / Formatting / Type checking
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.done.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The hooks shell out to the repo's own tooling (bun run gen, biome,
      # prettier, markdownlint, tailwint, svelte-check), so deps have to exist
      # first.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the agnix binary
        run: node node_modules/agnix/install.js

      # $lib resolves through .svelte-kit/tsconfig.json's paths, which is
      # generated and gitignored. The test/check scripts sync it themselves;
      # this keeps the rest of the hooks honest on a cold checkout too.
      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      # Same .pre-commit-config.yaml the local pre-commit hook runs: hygiene,
      # actionlint, hadolint, gitleaks, typos, and the formatters. The fixer
      # hooks autofix in place, so CI fails on any file one of them had to
      # modify. --no-fail-fast reports every failing hook in one run rather
      # than stopping at the first. The heavy gates below are skipped here and
      # run as their own named steps, so a failure says which gate broke.
      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: gen,oxlint,markdownlint,lint-tailwind,test-unit,check
        with:
          extra-args: --all-files --no-fail-fast

      - name: Lint
        run: bun run lint

      - name: Type check
        run:
          bunx svelte-kit sync && bunx svelte-check --tsconfig ./tsconfig.json
          --fail-on-warnings && bun check -p tsconfig.scripts.json

      # openapi.json, the integration suite's generated types and the config
      # JSON schema are derived from source. Regenerating has to be a no-op on
      # a clean tree.
      - name: Codegen is current
        run: |
          bun run gen
          if ! git diff --exit-code -- openapi.json homerun.schema.json tests/integration/support/openapi-types.ts docs/architecture.md; then
            echo "::error::Generated files are stale : run 'bun run gen' and commit the result."
            exit 1
          fi

      - name: Record result
        id: done
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "result=$JOB_STATUS" >> "$GITHUB_OUTPUT"

  action-smoke:
    name: GitHub Action (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Run the Homerun action
        id: homerun
        uses: ./
        with:
          args: --version

      - name: Check the CLI is on the PATH and its output came back
        env:
          STDOUT: ${{ steps.homerun.outputs.stdout }}
        run: |
          homerun --version
          test -n "$STDOUT"

  ts-test:
    name: Tests (TS)
    if: inputs.tests
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.done.outputs.result }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: homerun
          POSTGRES_PASSWORD: homerun
          POSTGRES_DB: homerun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homerun -d homerun_test" --health-interval
          5s --health-timeout 5s --health-retries 20
    env:
      HOMERUN_TEST_POSTGRES_URL: postgres://homerun:homerun@127.0.0.1:5432/homerun_test
      HOMERUN_TEST_S3_ENDPOINT: ${{ vars.HOMERUN_TEST_S3_ENDPOINT }}
      HOMERUN_TEST_S3_BUCKET: ${{ vars.HOMERUN_TEST_S3_BUCKET }}
      HOMERUN_TEST_S3_ACCESS_KEY_ID:
        ${{ secrets.HOMERUN_TEST_S3_ACCESS_KEY_ID }}
      HOMERUN_TEST_S3_SECRET_ACCESS_KEY:
        ${{ secrets.HOMERUN_TEST_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install socat
        run: sudo apt-get update && sudo apt-get install -y socat

      - name: Pull Docker Hub images through Google's mirror
        run: |
          daemon_config=/etc/docker/daemon.json
          current="$(sudo cat "$daemon_config" 2>/dev/null || true)"
          [ -n "$current" ] || current='{}'
          echo "$current" | jq '."registry-mirrors" = ["https://mirror.gcr.io"]' | sudo tee "$daemon_config" >/dev/null
          sudo systemctl reload docker
          for _ in $(seq 20); do
            docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io && exit 0
            sleep 1
          done
          echo "::error::The Docker daemon never picked up the registry mirror."
          exit 1

      - name: Build app
        run: bun run build

      - name: Tests (Unit)
        timeout-minutes: 20
        run:
          bunx svelte-kit sync && bun --config=bunfig.unit.toml test tests/unit
          --timeout 120000 --coverage-reporter=lcov --coverage-dir=coverage/unit

      - name: Tests (Integration)
        timeout-minutes: 30
        run:
          bun run test:integration -- --coverage-reporter=lcov
          --coverage-dir=coverage/integration

      - name: Record result
        id: done
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "result=$JOB_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always()
        uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
